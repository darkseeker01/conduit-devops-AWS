services:
  db:
    image: mysql:8.0
    container_name: conduit-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: conduit
      MYSQL_USER: conduit_user
      MYSQL_PASSWORD: ConduitDev_2026!
      MYSQL_ROOT_PASSWORD: ConduitRoot_2026!
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: conduit-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      PROD_DB_USERNAME: conduit_user
      PROD_DB_PASSWORD: ConduitDev_2026!
      PROD_DB_NAME: conduit
      PROD_DB_HOSTNAME: db
      PROD_DB_DIALECT: mysql
      PROD_DB_LOGGING: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: conduit-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: